<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina nu există — 1cent-wise</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0B0F14;
      color: #F0EDE6;
      font-family: 'Segoe UI', system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .box {
      max-width: 420px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #F0EDE6, #D4A853);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #8B9AAF;
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-block;
      padding: 0.7rem 1.5rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #D4A853, #C69840);
      color: #0B0F14;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Pagina nu există. Poate ai greșit adresa sau produsul nu mai e disponibil.</p>
    <a href="/">Înapoi la magazin</a>
  </div>
</body>
</html>
